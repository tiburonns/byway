name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release and privacy contract
        run: |
          python3 Tests/validate-release-contract.py
          plutil -lint Xcode/byway/Resources/PrivacyInfo.xcprivacy
          plutil -lint Xcode/byway/byway.entitlements
          plutil -lint Xcode/byway/byway.local.entitlements
      - name: Core integration tests
        run: ./Tests/run-core-tests.sh
      - name: App Intent integration tests
        run: ./Tests/run-intent-tests.sh
      - name: Shortcut localization audit
        run: ./Tests/run-shortcut-audit.sh
      - name: Build Release for iOS Simulator
        run: >-
          xcodebuild build
          -project Xcode/byway.xcodeproj
          -scheme byway
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build Release for iPhoneOS
        run: >-
          xcodebuild build
          -project Xcode/byway.xcodeproj
          -scheme byway
          -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Package AltStore IPA
        run: |
          chmod +x script/build_altstore_ipa.sh
          script/build_altstore_ipa.sh
